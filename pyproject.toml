[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus9-antigravity"
version = "0.3.0"
description = "Nine executable context-efficiency modules for Antigravity"
requires-python = ">=3.12,<3.14"
dependencies = ["mcp==1.30.0", "tree-sitter==0.25.2", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2", "tree-sitter-python==0.25.0", "pywin32==311; sys_platform == 'win32'"]
license = "MIT"

[project.scripts]
nexus9 = "nexus9.server:main"

[tool.setuptools.packages.find]
where = ["src"]
