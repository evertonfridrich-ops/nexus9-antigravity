[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus9-antigravity"
version = "0.3.0"
description = "Nine executable context-efficiency modules for Antigravity"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Everton Fridrich", email = "evertonfridrich@gmail.com" }
]
license = { text = "AGPL-3.0-only" }
keywords = ["mcp", "antigravity", "context-efficiency", "tokens", "tree-sitter", "ast"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp==1.30.0",
    "tree-sitter==0.25.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-python==0.25.0",
    "pywin32==311; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/evertonfridrich-ops/nexus9-antigravity"
Repository = "https://github.com/evertonfridrich-ops/nexus9-antigravity.git"
Issues = "https://github.com/evertonfridrich-ops/nexus9-antigravity/issues"

[project.scripts]
nexus9 = "nexus9.server:main"

[tool.setuptools.packages.find]
where = ["src"]
