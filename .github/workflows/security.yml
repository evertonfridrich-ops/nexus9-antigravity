name: Security Scan & Supply Chain

on:
  push:
    branches: [main, principal]
  pull_request:
    branches: [main, principal]
  schedule:
    - cron: '30 3 * * 1'

permissions:
  actions: read
  contents: read

jobs:
  security-audit:
    name: SAST Code & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: '3.12'

      - name: Install Security Tools
        run: python -m pip install bandit pip-audit

      - name: Run Bandit (Python SAST Security Scan)
        run: bandit -r src/ -ll

      - name: Audit Dependencies (CVE Vulnerability Scan)
        run: pip-audit -r requirements.lock.txt

  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: '3.12'

      - name: Generate SBOM
        run: |
          python -m pip install cyclonedx-bom
          cyclonedx-py requirements requirements.lock.txt -o cyclonedx-sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: cyclonedx-sbom.json
